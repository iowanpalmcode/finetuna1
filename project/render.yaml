services:
  - type: web
    name: aimotional
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # --timeout 120: comfortably above the OpenAI client's 45s timeout x2
    # retries (see llm_client.py) so a slow OpenRouter response gets caught
    # and turned into a clean JSON error by the route itself, instead of
    # gunicorn silently killing the worker mid-request first.
    startCommand: gunicorn --bind 0.0.0.0:$PORT --timeout 120 ui_server:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      # sync: false means Render will NOT read/store this value from this
      # file (or git) at all - it just declares that the service needs an
      # OPENROUTER_API_KEY, and prompts you to paste the real value once in
      # the Render Dashboard (Service -> Environment) after the first
      # Blueprint deploy. It's saved there, persists across redeploys, and
      # never touches this repo.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        sync: false
      # Same sync: false pattern as above - paste your Neon Postgres
      # connection string (from the Neon dashboard, "Connection string",
      # pooled connection) into the Render Dashboard after the first
      # Blueprint deploy. Arena analytics persist here instead of a local
      # SQLite file, which Render's free tier wipes on every restart.
      - key: DATABASE_URL
        sync: false
    autoDeploy: true
