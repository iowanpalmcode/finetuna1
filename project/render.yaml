services:
  - type: web
    name: aimotional
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # --timeout 150: comfortably above the OpenAI client's 45s timeout x2
    # attempts (see llm_client.py's _MAX_RETRIES) - worst case ~91.5s per
    # Arena side - so a slow OpenRouter response gets caught and turned into
    # a clean JSON error by the route itself, instead of gunicorn silently
    # killing the worker mid-request first (which used to surface to users
    # as a raw "status 500" instead of a real error message).
    startCommand: gunicorn --bind 0.0.0.0:$PORT --timeout 150 ui_server:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      # sync: false means Render will NOT read/store this value from this
      # file (or git) at all - it just declares that the service needs an
      # OPENROUTER_API_KEY, and prompts you to paste the real value once in
      # the Render Dashboard (Service -> Environment) after the first
      # Blueprint deploy. It's saved there, persists across redeploys, and
      # never touches this repo.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        sync: false
      # Same sync: false pattern - the Settings modal's other 3 model
      # choices each have a code-level default (see llm_client.py's
      # MODEL_CHOICES), so these are optional overrides for when a free-tier
      # slug gets renamed/deprecated upstream, not required for first deploy.
      - key: OPENROUTER_MODEL_NEMOTRON
        sync: false
      - key: OPENROUTER_MODEL_GEMMA
        sync: false
      - key: OPENROUTER_MODEL_LING
        sync: false
      # Same sync: false pattern as above - paste your Neon Postgres
      # connection string (from the Neon dashboard, "Connection string",
      # pooled connection) into the Render Dashboard after the first
      # Blueprint deploy. Arena analytics persist here instead of a local
      # SQLite file, which Render's free tier wipes on every restart.
      - key: DATABASE_URL
        sync: false
    autoDeploy: true
